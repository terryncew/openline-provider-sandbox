name: PROVIDER-EFFECT-LIVE-001

on:
  workflow_dispatch:
    inputs:
      confirmation:
        description: 'Type RUN DISPOSABLE MERGE to authorize one harmless test PR merge'
        required: true
        type: string

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: provider-effect-live-001
  cancel-in-progress: false

jobs:
  live-provider:
    if: github.repository == 'terryncew/openline-provider-sandbox' && inputs.confirmation == 'RUN DISPOSABLE MERGE'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-wallet
          ref: c35e7f427a26cddfc4e7d300a74b84aacc0ea64e
          path: wallet
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install the pinned Wallet implementation
        run: python -m pip install ./wallet
      - name: Verify the launcher before granting mutation authority
        run: python -m unittest discover -s tests -v
      - name: Run the real disposable GitHub experiment
        env:
          OPENLINE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPERIMENT_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/provider_live.py \
            --run-id "$EXPERIMENT_RUN_ID" \
            --state "$RUNNER_TEMP/provider-private" \
            --output "$RUNNER_TEMP/provider-public" \
            --confirm 'RUN DISPOSABLE MERGE'
      - name: Preserve public evidence even on failure
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: provider-effect-live-${{ github.run_id }}
          path: ${{ runner.temp }}/provider-public/
          if-no-files-found: warn
          retention-days: 90
