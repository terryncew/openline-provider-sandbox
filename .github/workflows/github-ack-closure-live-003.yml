name: GITHUB-ACK-CLOSURE-LIVE-003

on:
  push:
    branches: [main, "proof/**"]
    paths:
      - ".github/workflows/github-ack-closure-live-003.yml"
      - "GITHUB_ACK_CLOSURE_LIVE_003.md"
      - "PREREGISTRATION_GITHUB_ACK_CLOSURE_LIVE_003.json"
      - "scripts/github_ack_closure_live_003.py"
      - "tests/test_github_ack_closure_live_003.py"
  pull_request:
    paths:
      - ".github/workflows/github-ack-closure-live-003.yml"
      - "GITHUB_ACK_CLOSURE_LIVE_003.md"
      - "PREREGISTRATION_GITHUB_ACK_CLOSURE_LIVE_003.json"
      - "scripts/github_ack_closure_live_003.py"
      - "tests/test_github_ack_closure_live_003.py"
  workflow_dispatch:
    inputs:
      confirmation:
        description: "Type RUN GITHUB ACK DIRECT CLOSURE to authorize one disposable GitHub merge"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: github-ack-closure-live-003
  cancel-in-progress: false

jobs:
  controlled-proof:
    if: github.event_name != 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-wallet
          ref: 4d26040c0f8e835184ebb710356c9601842610fe
          path: wallet
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Wallet
        run: python -m pip install "./wallet[mcp]"
      - name: Verify exact Wallet pin
        run: test "$(git -C wallet rev-parse HEAD)" = "4d26040c0f8e835184ebb710356c9601842610fe"
      - name: Test exact Wallet repair
        run: python -m unittest discover -s wallet/tests -v
      - name: Test provider sandbox including LIVE-003 fixture
        run: python -m unittest discover -s tests -v
      - name: Compile launcher
        run: python -m compileall -q scripts tests

  live-provider:
    if: github.event_name == 'workflow_dispatch' && inputs.confirmation == 'RUN GITHUB ACK DIRECT CLOSURE'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-wallet
          ref: 4d26040c0f8e835184ebb710356c9601842610fe
          path: wallet
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install exact Wallet
        run: python -m pip install "./wallet[mcp]"
      - name: Verify exact Wallet pin
        run: test "$(git -C wallet rev-parse HEAD)" = "4d26040c0f8e835184ebb710356c9601842610fe"
      - name: Test Wallet before provider authority
        run: python -m unittest discover -s wallet/tests -v
      - name: Test provider harness before provider authority
        run: python -m unittest discover -s tests -v
      - name: Run real direct-commit closure proof
        env:
          OPENLINE_GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          EXPERIMENT_RUN_ID: ${{ github.run_id }}
        run: |
          python scripts/github_ack_closure_live_003.py \
            --run-id "$EXPERIMENT_RUN_ID" \
            --state "$RUNNER_TEMP/github-ack-closure-003-private" \
            --output "$RUNNER_TEMP/github-ack-closure-003-public" \
            --confirm 'RUN GITHUB ACK DIRECT CLOSURE'
      - name: Independently verify public evidence
        run: |
          python scripts/github_ack_closure_live_003.py \
            --verify "$RUNNER_TEMP/github-ack-closure-003-public" \
            --require-live
      - name: Reject accidental private-key evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          OUT="$RUNNER_TEMP/github-ack-closure-003-public"
          if [[ -d "$OUT" ]] && find "$OUT" -type f -name '*.key' | grep -q .; then
            echo "::error::private key entered public evidence"
            exit 3
          fi
      - name: Preserve public evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: github-ack-closure-live-003-${{ github.run_id }}
          path: ${{ runner.temp }}/github-ack-closure-003-public/
          if-no-files-found: warn
          retention-days: 90
