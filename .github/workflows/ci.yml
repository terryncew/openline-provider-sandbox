name: CI
on:
  push:
    branches: [main, 'fix/**', 'feat/**']
  pull_request:
    branches: [main, 'fix/**', 'feat/**']
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        python-version: ['3.11', '3.12', '3.13']
    steps:
      - uses: actions/checkout@v4
      - uses: actions/checkout@v4
        with:
          repository: terryncew/openline-wallet
          ref: 323c11f55c9c6bcc6d618ce4c0f3f19cbbc627bd
          path: wallet
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
      - run: python -m pip install "./wallet[mcp]"
      - name: Verify exact Wallet source pin
        run: test "$(git -C wallet rev-parse HEAD)" = "323c11f55c9c6bcc6d618ce4c0f3f19cbbc627bd"
      - name: Test pinned Wallet downstream suite
        run: python -m unittest discover -s wallet/tests -v
      - name: Test complete local sandbox path
        run: python -m unittest discover -s tests -v
      - name: Compile launcher
        run: python -m compileall -q scripts tests
